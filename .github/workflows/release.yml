name: Release

# Wydanie: `git tag v0.1.0 && git push origin v0.1.0`. Wersja w package.json musi
# zgadzać się z tagiem — electron-builder bierze ją do nazwy instalatora i latest.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sprawdź zgodność tagu z package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME nie zgadza się z wersją $version w package.json"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Budujemy bez publikacji, a pliki wgrywa `gh` — przy `--publish always`
      # electron-builder kończył proces w trakcie wysyłania instalatora i w wydaniu
      # zostawał sam `.blockmap`, bez `.exe` i `latest.yml` (v0.1.0, 24.11.2026).
      - name: Build instalatora
        run: npm run build && npx electron-builder --win --x64 --publish never
      - name: Publikacja w GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          ls -l "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Projekt Exile Overlay $GITHUB_REF_NAME" \
              --notes "Instalator dla Windows. Windows może pokazać ostrzeżenie SmartScreen — kliknij „Więcej informacji”, a potem „Uruchom mimo to”. Instrukcja: README."
          fi
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name'
